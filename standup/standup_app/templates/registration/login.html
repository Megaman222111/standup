<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.83.1">
    <title>Login.</title>

    <link href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/lux/bootstrap.min.css" crossorigin="anonymous" rel="stylesheet">
    <link href="https://unpkg.com/purecss@2.0.6/build/pure-min.css" crossorigin="anonymous" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/Megaman222111/standup-css/login.css" crossorigin="anonymous" rel="stylesheet">
  </head>
  <body class="center">
    <main class="form-signin">
      <div class="border border-dark">
      <form class="pure-form pure-form-aligned" method="POST">
        {% csrf_token %}
        <section>
          <fieldset>
            <h2 class="h2">Stand-Up.</h2><br><br>
            <h4 class="h4">Login.</h4><br>
            <label for="stacked-email" class="h6">Username</label>
            <span type="text" id="stacked-email" placeholder="Username" name="text">{{form.username}}</span><br><br>
            <label for="stacked-password" class="h6">Password </label>
            <span type="password" id="stacked-password" placeholder="Password" name="password">{{form.password}}</span><br><br>
            <p class="pure-form-message"><a href="{% url "password_reset" %}">Forgotten your password?</a></p>
            <p class="pure-form-message"><a href="{% url "signup" %}">Don't have an account?</a></p>
            <label for="stacked-remember" class="pure-checkbox">
              <button type="submit" class="pure-button btn-primary text-white" name="Create User">Sign in</button>
              {{form.errors}}
            </fieldset>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
