  <body class="center">
    <script>
    function myFunction() {
      var x = document.getElementById("stacked-password");
      if (x.type === "password") {
        x.type = "text";
      } else {
        x.type = "password";
      }
    } 
  </script>
    <main class="form-signin">
      <div class="border border-dark">
      <form class="pure-form pure-form-aligned">
        <section>
          <fieldset>
            <img src="https://raw.githubusercontent.com/Megaman222111/standup-css/main/LogoWhite.png">
            <h3 class="h3">Login.</h3><br>
            <label for="stacked-email" class="h6">Email</label>
            <input type="email" id="stacked-email" placeholder="Email" name="email"/><br><br>
            <label for="stacked-password" class="h6">Password </label>
            <input type="password" id="stacked-password" placeholder="Password" name="password"/><br><br>
            <label for="stacked-remember" class="pure-checkbox">
              <input type="checkbox" onclick="myFunction()" id="stacked-remember"/> Show Password</label><br><br>
              <button type="submit" class="pure-button btn-primary text-white" name="Create User">Sign in</button>
            </fieldset>
          </form>
        </section>
      </main>
    </div>
